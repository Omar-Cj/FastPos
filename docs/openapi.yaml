      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this order.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderDetail'
          description: ''
  /api/v1/admin/payments/:
    get:
      operationId: admin_payments_list
      description: Every payment attempt of the admin's store, newest first.
      parameters:
      - in: query
        name: initiated_after
        schema:
          type: string
          format: date-time
      - in: query
        name: initiated_before
        schema:
          type: string
          format: date-time
      - in: query
        name: method
        schema:
          type: string
          enum:
          - EDAHAB
          - WAAFI
        description: |-
          * `WAAFI` - Waafi (Hormuud)
          * `EDAHAB` - E-Dahab (Somtel)
      - in: query
        name: order
        schema:
          type: string
          format: uuid
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - FAILED
          - PENDING
          - SUCCESS
        description: |-
          * `PENDING` - Pending
          * `SUCCESS` - Success
          * `FAILED` - Failed
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminPaymentList'
          description: ''
  /api/v1/admin/payments/{id}/:
