openapi: 3.0.3
info:
  title: FastPOS API
  version: 1.0.0
  description: 'Self-checkout kiosk backend. Kiosk endpoints use `Authorization: Kiosk
    <token>`; admin endpoints use `Authorization: Bearer <jwt>`.'
paths:
  /api/v1/admin/categories/:
    get:
      operationId: admin_categories_list
      description: |-
        Filters the queryset to the admin's store.

        Superusers have no store and must pass `?store=<id>` (or `store` in the body on create).
        Subclasses set `store_field = "store"` (default) to the FK path that leads to the Store,
        e.g. `"order__store"`.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: admin_categories_create
      description: |-
        Filters the queryset to the admin's store.

        Superusers have no store and must pass `?store=<id>` (or `store` in the body on create).
        Subclasses set `store_field = "store"` (default) to the FK path that leads to the Store,
        e.g. `"order__store"`.
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/admin/categories/{id}/:
    get:
      operationId: admin_categories_retrieve
      description: |-
        Filters the queryset to the admin's store.

        Superusers have no store and must pass `?store=<id>` (or `store` in the body on create).
        Subclasses set `store_field = "store"` (default) to the FK path that leads to the Store,
        e.g. `"order__store"`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: admin_categories_update
      description: |-
        Filters the queryset to the admin's store.

        Superusers have no store and must pass `?store=<id>` (or `store` in the body on create).
        Subclasses set `store_field = "store"` (default) to the FK path that leads to the Store,
        e.g. `"order__store"`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: admin_categories_partial_update
      description: |-
        Filters the queryset to the admin's store.

        Superusers have no store and must pass `?store=<id>` (or `store` in the body on create).
        Subclasses set `store_field = "store"` (default) to the FK path that leads to the Store,
        e.g. `"order__store"`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: admin_categories_destroy
      description: |-
        Filters the queryset to the admin's store.

        Superusers have no store and must pass `?store=<id>` (or `store` in the body on create).
        Subclasses set `store_field = "store"` (default) to the FK path that leads to the Store,
        e.g. `"order__store"`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this category.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
