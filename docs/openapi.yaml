  /api/v1/admin/orders/:
    get:
      operationId: admin_orders_list
      description: |-
        Filters the queryset to the admin's store.

        Superusers have no store and must pass `?store=<id>` (or `store` in the body on create).
        Subclasses set `store_field = "store"` (default) to the FK path that leads to the Store,
        e.g. `"order__store"`.
      parameters:
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: kiosk
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - AWAITING_PAYMENT
          - CANCELLED
          - OPEN
          - PAID
        description: |-
          * `OPEN` - Open
          * `AWAITING_PAYMENT` - Awaiting payment
          * `PAID` - Paid
          * `CANCELLED` - Cancelled
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminOrderListList'
          description: ''
