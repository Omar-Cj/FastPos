      parameters:
      - in: path
        name: order_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: payment_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - kiosk
      security:
      - KioskToken: []
      responses:
